spring.application.name=ufound

# Fotos de objetos: hasta 5 MB (HU-09, HU-11)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sin ;jsessionid= en las URLs
server.servlet.session.tracking-modes=cookie

# MOCK: clave compartida por los usuarios de ejemplo de UsuarioService (HU-01).
# Se borra cuando los usuarios y sus hashes vengan de la base de datos.
ufound.mock.clave=Ufound-Sprint1
