spring.application.name=ufound

# Secretos: se leen de backend/.env (no se sube a git; copiar .env.example).
# Las variables de entorno del sistema tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties]

# Puerto: las plataformas de hosting (Render, Railway...) lo inyectan en PORT; en local usa 8080.
server.port=${PORT:8080}

# Detrás del proxy HTTPS de la plataforma: respetar X-Forwarded-* para que los redirects usen https.
server.forward-headers-strategy=framework

# Fotos de objetos: hasta 5 MB (HU-09, HU-11)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sin ;jsessionid= en las URLs
server.servlet.session.tracking-modes=cookie

# Permite enviar DELETE desde un formulario (campo oculto _method)
spring.mvc.hiddenmethod.filter.enabled=true

# Conexión a Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:objetos}

# Análisis de fotos con Gemini (HU-33), plan gratuito de Google AI Studio. Opcional: sin GEMINI_API_KEY la app
# funciona igual, solo que sin el análisis. GEMINI_MODELOS son los modelos a usar, en orden: si uno está
# saturado (pasa seguido en el plan gratuito) se prueba el siguiente.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelos=${GEMINI_MODELOS:gemini-3.1-flash-lite,gemini-3.5-flash-lite}

chatbot.api-key=${CHATBOT_API_KEY:}
chatbot.modelo=${CHATBOT_MODELO:gemini-3.1-flash-lite}
