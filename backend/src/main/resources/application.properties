spring.application.name=ufound

# Secretos: se leen de backend/.env (no se sube a git; copiar .env.example).
# Las variables de entorno del sistema tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties]

# Fotos de objetos: hasta 5 MB (HU-09, HU-11)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sin ;jsessionid= en las URLs
server.servlet.session.tracking-modes=cookie

# Conexión a Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:objetos}
